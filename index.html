<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Скоро здесь появится сайт школы</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0b1e3a 0%, #102a4c 50%, #08152a 100%);
    font-family: "Segoe UI", Arial, sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* Плавающие пузырьки на фоне */
  .bubble {
    position: absolute;
    border-radius: 50%;
    background: rgba(160, 220, 255, 0.15);
    animation: floatUp linear infinite;
    pointer-events: none;
  }

  @keyframes floatUp {
    0% {
      transform: translateY(100vh) scale(0.6);
      opacity: 0;
    }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% {
      transform: translateY(-10vh) scale(1.2);
      opacity: 0;
    }
  }

  .container {
    text-align: center;
    padding: 40px 25px;
    position: relative;
    z-index: 2;
    animation: fadeIn 1.5s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Анимированный градиент в заголовке */
  .title {
    font-size: clamp(1.6rem, 5vw, 3.2rem);
    font-weight: 800;
    letter-spacing: 2px;
    line-height: 1.35;
    text-transform: uppercase;
    background: linear-gradient(90deg, #a8e0ff, #d6f2ff, #a8e0ff, #e6f9ff, #a8e0ff);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 6s linear infinite;
    text-shadow: 0 0 30px rgba(168, 224, 255, 0.25);
    margin-bottom: 10px;
  }

  @keyframes shine {
    0%   { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  .school-name {
    display: block;
    margin-top: 18px;
    font-size: clamp(1rem, 3vw, 1.6rem);
    font-weight: 600;
    color: #bfe9ff;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeInUp 1.2s ease-out 0.8s forwards;
  }

  .line {
    width: 0;
    height: 2px;
    margin: 28px auto;
    background: linear-gradient(90deg, transparent, #a8e0ff, transparent);
    animation: growLine 1.8s ease-out 1s forwards;
  }

  @keyframes growLine {
    to { width: min(400px, 80vw); }
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Кнопка */
  .btn {
    display: inline-block;
    margin-top: 20px;
    padding: 16px 42px;
    font-size: clamp(0.95rem, 2.5vw, 1.15rem);
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    text-decoration: none;
    color: #0b1e3a;
    background: linear-gradient(135deg, #a8e0ff, #d6f2ff);
    border-radius: 50px;
    box-shadow: 0 0 20px rgba(168, 224, 255, 0.45), 0 0 60px rgba(168, 224, 255, 0.2);
    transition: all 0.35s ease;
    opacity: 0;
    animation: fadeInUp 1.2s ease-out 1.6s forwards, pulse 2.5s ease-in-out 2.8s infinite;
    position: relative;
    overflow: hidden;
  }

  .btn:hover {
    transform: translateY(-4px) scale(1.05);
    box-shadow: 0 0 35px rgba(168, 224, 255, 0.8), 0 0 90px rgba(168, 224, 255, 0.4);
    background: linear-gradient(135deg, #d6f2ff, #ffffff);
  }

  .btn:active {
    transform: translateY(-1px) scale(0.98);
  }

  /* Блик по кнопке */
  .btn::after {
    content: "";
    position: absolute;
    top: 0;
    left: -80%;
    width: 50%;
    height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.9), transparent);
    transform: skewX(-25deg);
    animation: glare 3s ease-in-out 3s infinite;
  }

  @keyframes glare {
    0%   { left: -80%; }
    25%  { left: 130%; }
    100% { left: 130%; }
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 20px rgba(168, 224, 255, 0.45), 0 0 60px rgba(168, 224, 255, 0.2); }
    50%      { box-shadow: 0 0 35px rgba(168, 224, 255, 0.75), 0 0 90px rgba(168, 224, 255, 0.35); }
  }
</style>
</head>
<body>

  <div class="container">
    <h1 class="title">
      Скоро здесь появится<br>сайт школы
      <span class="school-name">ЧОУ СШ №1</span>
    </h1>
    <div class="line"></div>
    <a class="btn" href="https://vk.ru/demias2026" target="_blank" rel="noopener noreferrer">
      Написать директору в ВК
    </a>
  </div>

<script>
  // Генерация плавающих пузырьков
  const body = document.body;
  for (let i = 0; i < 18; i++) {
    const b = document.createElement("div");
    b.className = "bubble";
    const size = Math.random() * 60 + 15;
    b.style.width = size + "px";
    b.style.height = size + "px";
    b.style.left = Math.random() * 100 + "vw";
    b.style.animationDuration = (Math.random() * 12 + 10) + "s";
    b.style.animationDelay = (Math.random() * 12) + "s";
    body.appendChild(b);
  }
</script>

</body>
</html>
